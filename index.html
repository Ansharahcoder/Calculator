<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Interactive Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Active button press visual feedback */
        .btn-press {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        /* Custom scrollbar for history panel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.6);
        }

        /* Keypad press animation effect */
        .calc-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .calc-btn:active {
            transform: scale(0.93);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col relative transition-all">

        <!-- Top Header & Actions -->
        <div class="flex justify-between items-center px-6 pt-5 pb-2 border-b border-slate-100 dark:border-slate-800/60">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                <span class="ml-2 text-xs font-semibold tracking-wider text-slate-400 uppercase">Calculator</span>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- History Toggle Button -->
                <button id="toggle-history-btn" title="Toggle History" class="p-2 text-slate-500 dark:text-slate-400 hover:text-brand-500 dark:hover:text-brand-500 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </button>
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" title="Toggle Theme" class="p-2 text-slate-500 dark:text-slate-400 hover:text-amber-500 dark:hover:text-amber-400 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>

        <div class="p-6 flex flex-col justify-end items-end min-h-[160px] bg-slate-50/50 dark:bg-slate-900/50">
            <!-- Secondary display (expression) -->
            <div id="expression-display" class="text-sm md:text-base text-slate-400 dark:text-slate-500 font-medium h-6 overflow-hidden text-right break-all"></div>
            <!-- Main display (current output) -->
            <div id="main-display" class="text-4xl md:text-5xl font-bold tracking-tight text-slate-800 dark:text-slate-100 mt-2 text-right break-all max-w-full">0</div>
        </div>

        <div class="p-5 grid grid-cols-4 gap-3 bg-slate-100/60 dark:bg-slate-950/40">
            <!-- Row 1 -->
            <button data-action="clear" class="calc-btn p-4 text-lg font-semibold rounded-2xl bg-red-100 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-900/50">AC</button>
            <button data-action="backspace" class="calc-btn p-4 text-lg font-semibold rounded-2xl bg-slate-200/70 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700"><i class="fa-solid fa-backspace"></i></button>
            <button data-action="percent" class="calc-btn p-4 text-lg font-semibold rounded-2xl bg-slate-200/70 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700">%</button>
            <button data-action="operator" data-value="/" class="calc-btn p-4 text-xl font-bold rounded-2xl bg-brand-500 text-white hover:bg-brand-600 shadow-lg shadow-brand-500/25">÷</button>

            <!-- Row 2 -->
            <button data-action="number" data-value="7" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">7</button>
            <button data-action="number" data-value="8" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">8</button>
            <button data-action="number" data-value="9" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">9</button>
            <button data-action="operator" data-value="*" class="calc-btn p-4 text-xl font-bold rounded-2xl bg-brand-500 text-white hover:bg-brand-600 shadow-lg shadow-brand-500/25">×</button>

            <!-- Row 3 -->
            <button data-action="number" data-value="4" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">4</button>
            <button data-action="number" data-value="5" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">5</button>
            <button data-action="number" data-value="6" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">6</button>
            <button data-action="operator" data-value="-" class="calc-btn p-4 text-xl font-bold rounded-2xl bg-brand-500 text-white hover:bg-brand-600 shadow-lg shadow-brand-500/25">−</button>

            <!-- Row 4 -->
            <button data-action="number" data-value="1" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">1</button>
            <button data-action="number" data-value="2" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">2</button>
            <button data-action="number" data-value="3" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">3</button>
            <button data-action="operator" data-value="+" class="calc-btn p-4 text-xl font-bold rounded-2xl bg-brand-500 text-white hover:bg-brand-600 shadow-lg shadow-brand-500/25">+</button>

            <!-- Row 5 -->
            <button data-action="number" data-value="0" class="calc-btn col-span-2 p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50 text-left pl-7">0</button>
            <button data-action="decimal" class="calc-btn p-4 text-xl font-semibold rounded-2xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-750 shadow-sm border border-slate-200/60 dark:border-slate-700/50">.</button>
            <button data-action="equals" class="calc-btn p-4 text-xl font-bold rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/25">=</button>
        </div>

        <div id="history-panel" class="absolute inset-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md transition-transform duration-300 translate-y-full flex flex-col z-20">
            <div class="flex justify-between items-center p-5 border-b border-slate-200 dark:border-slate-800">
                <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-history text-brand-500"></i> Calculation History
                </h3>
                <div class="flex items-center gap-2">
                    <button id="clear-history-btn" title="Clear History" class="p-2 text-xs font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition">
                        Clear All
                    </button>
                    <button id="close-history-btn" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>
            
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div id="empty-history-msg" class="text-center text-slate-400 dark:text-slate-500 py-12 text-sm">
                    No history records available yet.
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State management
            let currentInput = '0';
            let previousInput = '';
            let operator = null;
            let shouldResetDisplay = false;
            let history = [];

            // DOM Element References
            const mainDisplay = document.getElementById('main-display');
            const expressionDisplay = document.getElementById('expression-display');
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const toggleHistoryBtn = document.getElementById('toggle-history-btn');
            const closeHistoryBtn = document.getElementById('close-history-btn');
            const clearHistoryBtn = document.getElementById('clear-history-btn');
            const historyPanel = document.getElementById('history-panel');
            const historyList = document.getElementById('history-list');
            const emptyHistoryMsg = document.getElementById('empty-history-msg');

            function updateDisplay() {
                mainDisplay.textContent = currentInput;
                if (operator !== null) {
                    const opSymbol = getOperatorSymbol(operator);
                    expressionDisplay.textContent = `${previousInput} ${opSymbol}`;
                } else {
                    expressionDisplay.textContent = previousInput ? `${previousInput} =` : '';
                }
            }

            function getOperatorSymbol(op) {
                switch(op) {
                    case '/': return '÷';
                    case '*': return '×';
                    case '-': return '−';
                    case '+': return '+';
                    default: return op;
                }
            }

            function handleNumber(number) {
                if (currentInput === '0' || shouldResetDisplay) {
                    currentInput = number;
                    shouldResetDisplay = false;
                } else {
                    if (currentInput.length < 14) { // Limit length for display aesthetics
                        currentInput += number;
                    }
                }
                updateDisplay();
            }

            function handleDecimal() {
                if (shouldResetDisplay) {
                    currentInput = '0.';
                    shouldResetDisplay = false;
                    updateDisplay();
                    return;
                }
                if (!currentInput.includes('.')) {
                    currentInput += '.';
                    updateDisplay();
                }
            }

            function handleOperator(nextOperator) {
                const inputValue = parseFloat(currentInput);

                if (operator && shouldResetDisplay) {
                    operator = nextOperator;
                    updateDisplay();
                    return;
                }

                if (previousInput === '') {
                    previousInput = currentInput;
                } else if (operator) {
                    const result = calculate(parseFloat(previousInput), inputValue, operator);
                    if (result === 'Error') {
                        currentInput = 'Error';
                        previousInput = '';
                        operator = null;
                        updateDisplay();
                        return;
                    }
                    currentInput = String(result);
                    previousInput = currentInput;
                }

                shouldResetDisplay = true;
                operator = nextOperator;
                updateDisplay();
            }

            function calculate(firstNum, secondNum, op) {
                let result = 0;
                switch (op) {
                    case '+':
                        result = firstNum + secondNum;
                        break;
                    case '-':
                        result = firstNum - secondNum;
                        break;
                    case '*':
                        result = firstNum * secondNum;
                        break;
                    case '/':
                        if (secondNum === 0) return 'Error';
                        result = firstNum / secondNum;
                        break;
                    default:
                        return secondNum;
                }
                // Avoid floating-point weirdness (e.g. 0.1 + 0.2)
                return Math.round(result * 1e10) / 1e10;
            }

            function handleEquals() {
                if (operator === null || shouldResetDisplay) return;

                const firstNum = parseFloat(previousInput);
                const secondNum = parseFloat(currentInput);
                const result = calculate(firstNum, secondNum, operator);

                if (result === 'Error') {
                    currentInput = 'Error';
                    expressionDisplay.textContent = `${previousInput} ${getOperatorSymbol(operator)} ${secondNum} =`;
                    previousInput = '';
                    operator = null;
                    shouldResetDisplay = true;
                    updateDisplay();
                    return;
                }

                const fullExpression = `${previousInput} ${getOperatorSymbol(operator)} ${currentInput}`;
                
                // Add to history list
                addHistoryItem(fullExpression, result);

                currentInput = String(result);
                expressionDisplay.textContent = `${fullExpression} =`;
                previousInput = '';
                operator = null;
                shouldResetDisplay = true;
                mainDisplay.textContent = currentInput;
            }

            function handleClear() {
                currentInput = '0';
                previousInput = '';
                operator = null;
                shouldResetDisplay = false;
                updateDisplay();
            }

            function handleBackspace() {
                if (shouldResetDisplay) return;
                if (currentInput.length === 1 || currentInput === 'Error') {
                    currentInput = '0';
                } else {
                    currentInput = currentInput.slice(0, -1);
                }
                updateDisplay();
            }

            function handlePercent() {
                const num = parseFloat(currentInput);
                if (!isNaN(num)) {
                    currentInput = String(num / 100);
                    updateDisplay();
                }
            }

            function addHistoryItem(expression, result) {
                const item = { expression, result, id: Date.now() };
                history.unshift(item);
                renderHistory();
            }

            function renderHistory() {
                if (history.length === 0) {
                    emptyHistoryMsg.classList.remove('hidden');
                    historyList.innerHTML = '';
                    historyList.appendChild(emptyHistoryMsg);
                    return;
                }

                emptyHistoryMsg.classList.add('hidden');
                historyList.innerHTML = '';

                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/50 hover:border-brand-500/50 cursor-pointer transition flex flex-col items-end";
                    div.innerHTML = `
                        <div class="text-xs text-slate-400 dark:text-slate-500">${item.expression} =</div>
                        <div class="text-lg font-bold text-slate-700 dark:text-slate-200">${item.result}</div>
                    `;
                    div.addEventListener('click', () => {
                        currentInput = String(item.result);
                        updateDisplay();
                        toggleHistory(false);
                    });
                    historyList.appendChild(div);
                });
            }

            function toggleHistory(show) {
                if (show) {
                    historyPanel.classList.remove('translate-y-full');
                } else {
                    historyPanel.classList.add('translate-y-full');
                }
            }

            // Keypad button listeners
            document.querySelectorAll('.calc-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const action = button.dataset.action;
                    const value = button.dataset.value;

                    switch (action) {
                        case 'number':
                            handleNumber(value);
                            break;
                        case 'operator':
                            handleOperator(value);
                            break;
                        case 'decimal':
                            handleDecimal();
                            break;
                        case 'equals':
                            handleEquals();
                            break;
                        case 'clear':
                            handleClear();
                            break;
                        case 'backspace':
                            handleBackspace();
                            break;
                        case 'percent':
                            handlePercent();
                            break;
                    }
                });
            });

            // Keyboard navigation and key press support
            window.addEventListener('keydown', (e) => {
                if (e.key >= '0' && e.key <= '9') {
                    handleNumber(e.key);
                } else if (e.key === '.') {
                    handleDecimal();
                } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                    handleOperator(e.key);
                } else if (e.key === 'Enter' || e.key === '=') {
                    e.preventDefault();
                    handleEquals();
                } else if (e.key === 'Backspace') {
                    handleBackspace();
                } else if (e.key === 'Escape') {
                    handleClear();
                } else if (e.key === '%') {
                    handlePercent();
                }
            });

            // Theme toggle listener
            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
            });

            // History Panel Toggles
            toggleHistoryBtn.addEventListener('click', () => toggleHistory(true));
            closeHistoryBtn.addEventListener('click', () => toggleHistory(false));
            clearHistoryBtn.addEventListener('click', () => {
                history = [];
                renderHistory();
            });
        });
    </script>
</body>
</html>
